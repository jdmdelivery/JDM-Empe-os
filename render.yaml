services:
  - type: web
    name: jdm-empenos
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn "run:app" --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    healthCheckPath: /healthz
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: jdm-empenos-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "1"
      - key: BUSINESS_NAME
        value: JDM Empeños
      - key: BUSINESS_CURRENCY_SYMBOL
        value: RD$
      - key: BUSINESS_TIMEZONE
        value: America/Santo_Domingo
      - key: PYTHON_VERSION
        value: "3.11.9"

databases:
  - name: jdm-empenos-db
    plan: free
    databaseName: jdm_empenos
    user: jdm_empenos